<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Piper Neural TTS</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-row">
        <span class="logo-icon">🔊</span>
        <div>
          <h1 class="logo-title">Piper Neural TTS</h1>
          <p class="logo-subtitle">Offline & Private Speech Engine</p>
        </div>
      </div>
      <span class="badge">v1.1.2</span>
    </header>

    <!-- Engine Mode Selection -->
    <section class="section">
      <label class="section-label">Primary Speech Engine</label>
      <select id="speech-engine-select" class="select-input">
        <option value="gemini">✨ Google Gemini 3.8 AI (Studio Human Voice • &lt;1s Stream)</option>
        <option value="local">⚡ Instant Local Piper (0ms Latency • Runs 100% on PC)</option>
      </select>
    </section>

    <!-- Gemini AI Human Voice & Summarizer Configuration -->
    <section class="section gemini-card">
      <div class="row-between">
        <label class="section-label" style="color: #38bdf8;">✨ Google Gemini AI (Human Voice)</label>
        <span class="badge" id="gemini-status-badge" style="background:#065f46; color:#a7f3d0;">Free Tier Ready</span>
      </div>
      <div class="input-group" style="margin-top: 6px;">
        <input type="password" id="gemini-api-key" class="select-input" placeholder="Paste Google AI Studio API Key...">
        <div class="row-between" style="margin-top: 4px;">
          <a href="https://aistudio.google.com/app/apikey" target="_blank" class="free-key-link" style="color:#38bdf8; font-size:11px; text-decoration:none;">Get 100% Free API Key ↗</a>
          <button id="toggle-key-visibility" class="mini-btn" style="background:none; border:none; color:#94a3b8; font-size:11px; cursor:pointer;">Show</button>
        </div>
      </div>

      <div style="margin-top: 10px;">
        <label class="section-label">AI Model</label>
        <select id="gemini-model-select" class="select-input">
          <option value="gemini-3.8-flash">gemini-3.8-flash (Recommended • Ultra-Fast • Free)</option>
          <option value="gemini-3.8-flash-tts">gemini-3.8-flash-tts (Creative Studio Speech)</option>
        </select>
      </div>

      <div style="margin-top: 10px;">
        <label class="section-label">AI Voice Persona</label>
        <select id="gemini-voice-select" class="select-input">
          <option value="Puck">Puck (Male • Conversational, Natural Pauses)</option>
          <option value="Kore">Kore (Female • Empathetic, Calm Interviewer)</option>
          <option value="Fenrir">Fenrir (Male • Deep, Authoritative)</option>
          <option value="Aoede">Aoede (Female • Dynamic, Expressive)</option>
          <option value="Charon">Charon (Male • Steady, Professional)</option>
        </select>
      </div>
    </section>

    <!-- Language & Auto-Detection -->
    <section class="section">
      <label class="section-label">Language Detection Mode</label>
      <select id="language-mode" class="select-input">
        <option value="auto">🌐 Auto-Detect (Hindi & English)</option>
        <option value="hi">🇮🇳 Force Hindi (हिन्दी)</option>
        <option value="en">🇺🇸 Force English (US)</option>
      </select>
    </section>

    <!-- Preferred Voices -->
    <section class="section">
      <label class="section-label">Hindi Voice Persona</label>
      <select id="hindi-voice-select" class="select-input">
        <option value="hi_IN-pratham-medium">Pratham (Male, Natural - 38MB)</option>
        <option value="hi_IN-priyamvada-medium">Priyamvada (Female, Clear - 38MB)</option>
        <option value="hi_IN-rohan-medium">Rohan (Male, Deep - 38MB)</option>
      </select>

      <label class="section-label" style="margin-top: 10px;">English Voice Persona</label>
      <select id="english-voice-select" class="select-input">
        <option value="en_US-lessac-low">Lessac (Female, Fast - 16MB)</option>
        <option value="en_US-lessac-medium">Lessac (Female, Natural - 38MB)</option>
        <option value="en_US-amy-low">Amy (Female, Fast - 16MB)</option>
        <option value="en_US-amy-medium">Amy (Female, Natural - 38MB)</option>
        <option value="en_US-danny-low">Danny (Male, Fast - 16MB)</option>
      </select>
    </section>

    <!-- Speed & Hover Settings -->
    <section class="section">
      <div class="row-between">
        <label class="section-label">Default Reading Speed</label>
        <span id="speed-label" class="val-label">1.0x</span>
      </div>
      <input type="range" id="default-speed" min="0.5" max="2.5" step="0.1" value="1.0" class="slider">

      <div class="row-between" style="margin-top: 12px;">
        <label class="section-label">Hover-to-Seek (Paragraph Jump)</label>
        <input type="checkbox" id="hover-seek-toggle" checked>
      </div>
    </section>

    <!-- Test Audio Button -->
    <section class="section">
      <button id="test-voice-btn" class="primary-btn">
        <span>▶</span>
        <span>Test Active Voice Sample</span>
      </button>
    </section>

    <!-- Cached Models in IndexedDB -->
    <section class="section">
      <div class="row-between">
        <label class="section-label">Cached Neural Models</label>
        <span id="storage-usage" class="val-label">0.0 MB</span>
      </div>
      <div id="models-list" class="models-list">
        <div class="empty-state">Checking offline models...</div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>100% Client-Side • Powered by Rhasspy Piper</span>
    </footer>
  </div>

  <script src="../lib/voices-data.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="../lib/gemini-api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
