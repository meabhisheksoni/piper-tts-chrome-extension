<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Piper Neural TTS</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header with Minimalist Tab Navigation -->
    <header class="popup-header">
      <div class="logo-row">
        <span class="logo-icon">🔊</span>
        <div>
          <h1 class="logo-title">Piper Neural TTS</h1>
          <span class="version-badge">v1.2.2</span>
        </div>
      </div>
      <div class="header-nav">
        <button type="button" id="nav-action-btn" class="nav-btn active" title="Quick Action">⚡ Action</button>
        <button type="button" id="nav-settings-btn" class="nav-btn" title="Configuration">⚙️ Settings</button>
      </div>
    </header>

    <!-- VIEW 1: MINIMALIST ACTION VIEW (Default, Compact & Big Fonts) -->
    <main id="view-action" class="view-panel active">
      <!-- Engine Toggle: Segmented Pill -->
      <div class="engine-toggle-group">
        <button type="button" class="engine-toggle-btn active" id="btn-engine-kokoro" data-engine="local">
          <span class="toggle-icon">⚡</span>
          <div class="toggle-text-block">
            <span class="toggle-label">Kokoro</span>
            <span class="toggle-sub">100% Offline</span>
          </div>
        </button>
        <button type="button" class="engine-toggle-btn" id="btn-engine-gemini" data-engine="gemini">
          <span class="toggle-icon">✨</span>
          <div class="toggle-text-block">
            <span class="toggle-label">Gemini AI</span>
            <span class="toggle-sub">Human Voice</span>
          </div>
        </button>
      </div>

      <!-- Dynamic Voice Persona Selector -->
      <div class="action-field">
        <div class="row-between">
          <label class="field-label" id="voice-field-label">Active Voice Persona</label>
          <span class="voice-badge" id="voice-badge">Offline Studio</span>
        </div>
        <!-- Kokoro Voices Dropdown (100% Offline Studio English & Hindi) -->
        <select id="kokoro-voice-select" class="big-select">
          <optgroup label="English Voices (Studio)">
            <option value="af_heart" selected>Heart (Female • Conversational #1)</option>
            <option value="af_bella">Bella (Female • Bright & Expressive)</option>
            <option value="af_nicole">Nicole (Female • Audiobook Narrator)</option>
            <option value="am_adam">Adam (Male • Deep Conversational)</option>
            <option value="am_michael">Michael (Male • Clear Narrator)</option>
            <option value="am_puck">Puck (Male • Friendly Casual)</option>
            <option value="bf_emma">Emma (British Female • Crisp)</option>
            <option value="bm_george">George (British Male • BBC Style)</option>
          </optgroup>
          <optgroup label="Hindi Voices (Kokoro Native • 100% Offline)">
            <option value="hf_alpha">Alpha (Hindi Female • Studio)</option>
            <option value="hf_beta">Beta (Hindi Female • Clear)</option>
            <option value="hm_omega">Omega (Hindi Male • Deep Natural)</option>
            <option value="hm_psi">Psi (Hindi Male • Narrative)</option>
          </optgroup>
        </select>
        <!-- Gemini Voices Dropdown (Cloud AI • Hindi & English) -->
        <select id="gemini-voice-select" class="big-select" style="display:none;">
          <option value="Puck" selected>Puck (Male • Conversational, Natural Pauses)</option>
          <option value="Kore">Kore (Female • Empathetic, Calm Interviewer)</option>
          <option value="Fenrir">Fenrir (Male • Deep, Authoritative)</option>
          <option value="Aoede">Aoede (Female • Dynamic, Expressive)</option>
          <option value="Charon">Charon (Male • Steady, Professional)</option>
        </select>
      </div>

      <!-- Speed Scrubber with Large Readout -->
      <div class="action-field">
        <div class="row-between">
          <label class="field-label">Reading Speed</label>
          <span id="speed-label" class="big-speed-val">1.0x</span>
        </div>
        <input type="range" id="default-speed" min="0.5" max="2.5" step="0.1" value="1.0" class="big-slider">
      </div>

      <!-- Tactile Play Test Button -->
      <div class="action-footer">
        <button type="button" id="test-voice-btn" class="big-action-btn">
          <span class="btn-icon">▶</span>
          <span class="btn-text">Test Voice Sample</span>
        </button>
      </div>
    </main>

    <!-- VIEW 2: SETTINGS DRAWER (Clean, Minimalist & Focused) -->
    <main id="view-settings" class="view-panel" style="display:none;">
      <!-- Google Gemini API Key Section -->
      <div class="settings-card">
        <div class="row-between">
          <label class="settings-label">✨ Gemini API Key</label>
          <span class="badge" id="gemini-status-badge">Key Needed</span>
        </div>
        <div class="input-with-action">
          <input type="password" id="gemini-api-key" class="settings-input" placeholder="Paste Google AI Studio API Key...">
          <button type="button" id="toggle-key-visibility" class="ghost-btn">Show</button>
        </div>
        <div class="key-hint-row">
          <a href="https://aistudio.google.com/app/apikey" target="_blank" class="free-key-link">Get 100% Free API Key ↗</a>
        </div>
      </div>

      <!-- AI Model Selection -->
      <div class="settings-group">
        <label class="settings-label">Gemini AI Model</label>
        <select id="gemini-model-select" class="settings-input">
          <option value="gemini-2.5-flash-preview-tts">gemini-2.5-flash-preview-tts (Studio Audio)</option>
          <option value="gemini-2.0-flash">gemini-2.0-flash (Fast Audio)</option>
          <option value="gemini-3.8-flash">gemini-3.8-flash (Latest Generation)</option>
        </select>
      </div>

      <!-- Language Detection -->
      <div class="settings-group">
        <label class="settings-label">Language Detection Mode</label>
        <select id="language-mode" class="settings-input">
          <option value="auto">🌐 Auto-Detect (Hindi & English)</option>
          <option value="hi">🇮🇳 Force Hindi (हिन्दी)</option>
          <option value="en">🇺🇸 Force English (US)</option>
        </select>
      </div>

      <!-- Hover-to-Seek Toggle -->
      <div class="settings-row">
        <div>
          <div class="settings-title">Hover-to-Seek</div>
          <div class="settings-subtitle">Jump directly to hovered sentence</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="hover-seek-toggle" checked>
          <span class="slider-round"></span>
        </label>
      </div>

      <!-- Storage & Model Status -->
      <div class="settings-group">
        <div class="row-between">
          <label class="settings-label">Offline Neural Cache</label>
          <span id="storage-usage" class="badge-neutral">Ready</span>
        </div>
        <div id="models-list" class="models-list"></div>
      </div>

      <div class="settings-footer">
        <button type="button" id="btn-back-to-actions" class="secondary-btn">← Back to Actions</button>
      </div>
    </main>
  </div>

  <script src="../lib/voices-data.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="../lib/gemini-api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
